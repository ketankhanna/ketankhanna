<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Ketan Khanna: Marketing Automation, Data Science, Game Design">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.6" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22e4ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff3fd4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floor"><rect x="0" y="210" width="1280" height="110"/></clipPath>
    <style>
      .star { fill: #cfe8ff; animation: tw 3s ease-in-out infinite; }
      .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
      @keyframes tw { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      .grid line { stroke: #22e4ff; stroke-opacity: .35; stroke-width: 1.2; }
      .scroll { animation: run 2.4s linear infinite; }
      @keyframes run { from { transform: translateY(0) } to { transform: translateY(22px) } }
      .name { font: 800 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 10px; }
      .tag { font: 600 22px 'Consolas', 'Courier New', monospace; fill: #bfe9ff; letter-spacing: 2px; }
      .type { animation: type 4s steps(46) 0.5s both; }
      @keyframes type { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
      .caret { fill: #22e4ff; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .scan { fill: #22e4ff; opacity: .06; animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(330px) } }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="80" cy="40" r="1.4"/><circle class="star s2" cx="190" cy="95" r="1"/>
    <circle class="star s3" cx="310" cy="30" r="1.6"/><circle class="star" cx="455" cy="70" r="1"/>
    <circle class="star s2" cx="905" cy="38" r="1.5"/><circle class="star s3" cx="1010" cy="90" r="1"/>
    <circle class="star" cx="1135" cy="30" r="1.3"/><circle class="star s2" cx="1220" cy="120" r="1"/>
    <circle class="star s3" cx="40" cy="150" r="1"/><circle class="star" cx="1190" cy="180" r="1.2"/>
    <circle class="star s2" cx="620" cy="22" r="1"/><circle class="star s3" cx="760" cy="55" r="1.3"/>
  </g>

  <!-- horizon glow -->
  <ellipse cx="640" cy="212" rx="420" ry="120" fill="url(#sun)"/>

  <!-- perspective grid floor -->
  <g class="grid" clip-path="url(#floor)">
    <g class="scroll">
      <line x1="0" y1="210" x2="1280" y2="210"/><line x1="0" y1="226" x2="1280" y2="226"/>
      <line x1="0" y1="246" x2="1280" y2="246"/><line x1="0" y1="270" x2="1280" y2="270"/>
      <line x1="0" y1="298" x2="1280" y2="298"/><line x1="0" y1="330" x2="1280" y2="330"/>
      <line x1="0" y1="188" x2="1280" y2="188"/>
    </g>
    <line x1="640" y1="210" x2="640" y2="320"/>
    <line x1="640" y1="210" x2="480" y2="320"/><line x1="640" y1="210" x2="800" y2="320"/>
    <line x1="640" y1="210" x2="300" y2="320"/><line x1="640" y1="210" x2="980" y2="320"/>
    <line x1="640" y1="210" x2="100" y2="320"/><line x1="640" y1="210" x2="1180" y2="320"/>
    <line x1="640" y1="210" x2="-160" y2="320"/><line x1="640" y1="210" x2="1440" y2="320"/>
  </g>
  <line x1="0" y1="210" x2="1280" y2="210" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>

  <!-- HUD corners -->
  <g stroke="#22e4ff" stroke-width="2" fill="none" opacity=".7">
    <path d="M24 44 V24 H44"/><path d="M1236 24 H1256 V44"/>
    <path d="M24 276 V296 H44"/><path d="M1236 296 H1256 V276"/>
  </g>
  <text x="54" y="38" class="tag" style="font-size:12px;fill:#22e4ff;opacity:.7">SYS://KK-01  ONLINE</text>
  <text x="1226" y="38" class="tag" style="font-size:12px;fill:#ff3fd4;opacity:.7" text-anchor="end">TORONTO · CA</text>

  <!-- name -->
  <text x="640" y="128" text-anchor="middle" class="name" fill="url(#neon)" filter="url(#glow)">KETAN KHANNA</text>

  <!-- typed tagline -->
  <g class="type">
    <text x="640" y="176" text-anchor="middle" class="tag">marketing automation · data science · game design</text>
  </g>
  <rect class="caret" x="968" y="159" width="11" height="22"/>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="1280" height="36"/>
</svg>
