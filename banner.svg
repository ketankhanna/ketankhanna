<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Ketan Khanna: Marketing Automation, Advertising Operations, Data Science">
  <defs>
    <radialGradient id="space" cx="70%" cy="10%" r="90%">
      <stop offset="0" stop-color="#0d1a33"/>
      <stop offset=".55" stop-color="#060b18"/>
      <stop offset="1" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="planet" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#1a3a66"/>
      <stop offset=".6" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#040913"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0"/>
      <stop offset=".35" stop-color="#4cc9f0"/>
      <stop offset=".62" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .star { fill:#dbeaff; animation: tw 4s ease-in-out infinite; }
      .s2 { animation-delay:1.3s; } .s3 { animation-delay:2.6s; }
      @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:.95 } }
      .name { font: 700 58px 'Segoe UI','Helvetica Neue',Arial,sans-serif; letter-spacing:12px; }
      .tag { font: 600 17px 'Consolas','Courier New',monospace; fill:#9fc3e0; letter-spacing:3px; }
      .hud { font: 600 11px 'Consolas','Courier New',monospace; letter-spacing:2px; }
      .scan { fill:#4cc9f0; opacity:.05; animation: scan 7s linear infinite; }
      @keyframes scan { from { transform: translateY(-40px) } to { transform: translateY(330px) } }
      .pulse { animation: pu 3s ease-in-out infinite; transform-origin: 1110px 96px; }
      @keyframes pu { 0%,100% { opacity:.55 } 50% { opacity:1 } }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#space)"/>

  <!-- nebula wash -->
  <ellipse cx="1040" cy="70" rx="260" ry="90" fill="#1f5aa0" opacity=".22" filter="url(#soft)"/>
  <ellipse cx="220" cy="60" rx="220" ry="70" fill="#ff8a3d" opacity=".08" filter="url(#soft)"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="62" cy="38" r="1.3"/><circle class="star s2" cx="148" cy="92" r="1"/>
    <circle class="star s3" cx="276" cy="28" r="1.5"/><circle class="star" cx="402" cy="64" r="1"/>
    <circle class="star s2" cx="520" cy="22" r="1.2"/><circle class="star s3" cx="690" cy="48" r="1"/>
    <circle class="star" cx="820" cy="30" r="1.4"/><circle class="star s2" cx="930" cy="112" r="1"/>
    <circle class="star s3" cx="1210" cy="40" r="1.3"/><circle class="star" cx="1244" cy="150" r="1"/>
    <circle class="star s2" cx="34" cy="160" r="1"/><circle class="star s3" cx="610" cy="120" r="1"/>
  </g>

  <!-- distant blue crystal (EXIOS nod) -->
  <g class="pulse" filter="url(#glow)">
    <polygon points="1110,58 1128,96 1110,138 1092,96" fill="#4cc9f0" opacity=".35"/>
    <polygon points="1110,58 1128,96 1110,104" fill="#bfeaff" opacity=".6"/>
  </g>

  <!-- planet horizon -->
  <ellipse cx="640" cy="620" rx="900" ry="380" fill="url(#planet)"/>
  <path d="M -260 262 Q 640 216 1540 262" fill="none" stroke="url(#rim)" stroke-width="2.5" filter="url(#glow)"/>
  <!-- city lights on the planet -->
  <g fill="#ff8a3d" opacity=".55">
    <circle cx="470" cy="276" r="1.4"/><circle cx="488" cy="281" r="1"/><circle cx="505" cy="274" r="1.2"/>
    <circle cx="760" cy="279" r="1.3"/><circle cx="778" cy="284" r="1"/><circle cx="802" cy="276" r="1.1"/>
  </g>

  <!-- HUD frame -->
  <g stroke="#4cc9f0" stroke-width="2" fill="none" opacity=".75">
    <path d="M24 46 V24 H64"/><path d="M1216 24 H1256 V46"/>
    <path d="M24 274 V296 H64"/><path d="M1216 296 H1256 V274"/>
  </g>
  <text x="74" y="36" class="hud" fill="#4cc9f0" opacity=".8">SYS // KK-01 · ONLINE</text>
  <text x="1206" y="36" class="hud" fill="#ff8a3d" opacity=".85" text-anchor="end">TORONTO · 43.65°N 79.38°W</text>
  <text x="74" y="292" class="hud" fill="#6f8bab" opacity=".8">MARKETING AUTOMATION · ADVERTISING OPERATIONS · DATA SCIENCE</text>

  <!-- name -->
  <text x="640" y="132" text-anchor="middle" class="name" fill="url(#title)" filter="url(#glow)">KETAN KHANNA</text>
  <line x1="470" y1="152" x2="810" y2="152" stroke="url(#rim)" stroke-width="2"/>
  <text x="640" y="184" text-anchor="middle" class="tag">CAMPAIGNS THAT LAND · DATA THAT EXPLAINS WHY</text>

  <rect class="scan" x="0" y="0" width="1280" height="32"/>
</svg>
